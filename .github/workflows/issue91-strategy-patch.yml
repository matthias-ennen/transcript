    paths:
      - .github/workflows/issue91-strategy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-91-ai-group-feasibility
          fetch-depth: 0
