name: Apply issue 31 implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: issue-31-original-status
          submodules: false
          fetch-depth: 0

      - name: Relax known duplicate guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/issue31_patch.py')
          text = p.read_text(encoding='utf-8')
          old = """    if count != 1:\n        raise RuntimeError(f'{path}: expected one occurrence, found {count}: {old[:80]!r}')\n    write(path, text.replace(old, new, 1))\n"""
          new = """    special_duplicate = (\n        old.startswith('    transcriptSectionMinutes = null,\\n    isEditingTranscript = false,')\n        or old == 'TranscriptEditQuestionDialog('\n    )\n    if count == 0 or (count > 1 and not special_duplicate):\n        raise RuntimeError(f'{path}: expected one occurrence, found {count}: {old[:80]!r}')\n    write(path, text.replace(old, new, 1))\n"""
          if old not in text:
              raise SystemExit('replace_once helper not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply implementation patch
        run: python3 tools/issue31_patch.py

      - name: Commit implementation
        run: |
          rm tools/issue31_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement issue 31 transcript provenance UI"
          git push origin HEAD:issue-31-original-status
