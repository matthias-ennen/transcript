name: Apply issue 31 implementation

on:
  push:
    branches:
      - issue-31-original-status

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: issue-31-original-status
          submodules: false
          fetch-depth: 0

      - name: Apply implementation patch
        run: python3 tools/issue31_patch.py

      - name: Commit implementation
        run: |
          rm tools/issue31_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement issue 31 transcript provenance UI"
          git push origin HEAD:issue-31-original-status
