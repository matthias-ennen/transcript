name: Quality Diagnose

on:
  push:
    branches:
      - issues-54-120-stability-main-workflow

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source and whisper.cpp
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Debug unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Release lint
        run: ./gradlew --no-daemon lintRelease
