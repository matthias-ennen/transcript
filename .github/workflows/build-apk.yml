name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source and whisper.cpp
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Vulkan shader build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslc libvulkan-dev spirv-headers
          mkdir -p llm/src/main/cpp/host-vulkan-headers
          cp -R /usr/include/vulkan llm/src/main/cpp/host-vulkan-headers/
          cp -R /usr/include/vk_video llm/src/main/cpp/host-vulkan-headers/vulkan/
          cp -R /usr/include/spirv llm/src/main/cpp/host-vulkan-headers/
          sed -i \
            's/vkGetPhysicalDeviceFeatures2(/VULKAN_HPP_DEFAULT_DISPATCHER.vkGetPhysicalDeviceFeatures2(/g' \
            third_party/llama.cpp/ggml/src/ggml-vulkan/ggml-vulkan.cpp

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set automatic APK version
        run: |
          echo "TRANSCRIPT_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "TRANSCRIPT_VERSION_NAME=0.5.${GITHUB_RUN_NUMBER}-signed" >> "$GITHUB_ENV"

      - name: Restore permanent APK signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Required signing secret ANDROID_SIGNING_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/transcript-signing.jks"

      - name: Run unit tests and build permanently signed debug APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/transcript-signing.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Verify KleidiAI runtime payload
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          for library in \
            libggml-cpu-android_armv8.0_1.so \
            libggml-cpu-android_armv8.2_1.so \
            libggml-cpu-android_armv8.6_1.so \
            libggml-cpu-android_armv9.0_1.so; do
            unzip -l "$apk" | grep -F "lib/arm64-v8a/$library"
          done
          audit_dir="$RUNNER_TEMP/kleidiai-audit"
          mkdir -p "$audit_dir"
          unzip -p "$apk" \
            lib/arm64-v8a/libggml-cpu-android_armv8.6_1.so \
            > "$audit_dir/libggml-cpu-i8mm.so"
          strings "$audit_dir/libggml-cpu-i8mm.so" | grep -F "CPU_KLEIDIAI"
          strings "$audit_dir/libggml-cpu-i8mm.so" | grep -E \
            "kai_run_matmul_clamp.*(dotprod|i8mm)"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: transcript-signed-apk-${{ env.TRANSCRIPT_VERSION_CODE }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
