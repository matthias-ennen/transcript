plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'de.matthiasennen.transcript.ai'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_shared'
                }
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Clang 14 from NDK r25 crashes while compiling llama.cpp's ARMv9/SVE2
    // quant kernels. NDK r27c ships Clang 18 and supports the same Android ABI.
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
}
